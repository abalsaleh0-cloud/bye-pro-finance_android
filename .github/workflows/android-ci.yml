name: Android CI and APK

on:
  push:
    branches: [main, 'recovery/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android release version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION_NAME="$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | head -n 1)"
          APP_VERSION_CODE="$(sed -n 's/^APP_VERSION_CODE=//p' gradle.properties | head -n 1)"
          [[ "$APP_VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$APP_VERSION_CODE" =~ ^[0-9]+$ ]]
          echo "APP_VERSION_NAME=$APP_VERSION_NAME" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Create local debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          emulator-boot-timeout: 600
          script: |
            set -e
            adb wait-for-device
            for attempt in $(seq 1 120); do
              state=$(adb get-state 2>/dev/null || true)
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$state" = "device" ] && [ "$boot_completed" = "1" ]; then
                break
              fi
              if [ "$state" = "offline" ]; then
                adb reconnect offline >/dev/null 2>&1 || true
              fi
              sleep 5
            done
            test "$(adb get-state)" = "device"
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            adb shell cmd package list packages >/dev/null
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.aistudio.byeprofinance.kxmpzq
            adb shell monkey -p com.aistudio.byeprofinance.kxmpzq 1 >/dev/null
            sleep 8
            adb shell pidof com.aistudio.byeprofinance.kxmpzq >/dev/null
            adb shell dumpsys package com.aistudio.byeprofinance.kxmpzq | grep -q "versionName=$APP_VERSION_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-APK-${{ env.APP_VERSION_NAME }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
