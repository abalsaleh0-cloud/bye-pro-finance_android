name: Android CI and APK

on:
  push:
    branches: [main, 'recovery/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify Android release version
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^APP_VERSION_NAME=10.0.66$' gradle.properties
          grep -q '^APP_VERSION_CODE=10066$' gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Create local debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run Android emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          script: |
            adb wait-for-device
            for attempt in $(seq 1 60); do
              boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              package_service=$(adb shell service check package 2>/dev/null || true)
              activity_service=$(adb shell service check activity 2>/dev/null || true)
              if [ "$boot_completed" = "1" ] && echo "$package_service" | grep -q "found" && echo "$activity_service" | grep -q "found"; then break; fi
              sleep 5
            done
            adb shell cmd package list packages >/dev/null
            gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
