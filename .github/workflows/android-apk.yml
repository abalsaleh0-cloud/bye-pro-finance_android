name: Build Android APK

on:
  push:
    paths:
      - "bye-pro-finance.zip"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          test -f bye-pro-finance.zip
          mkdir -p source
          unzip -q bye-pro-finance.zip -d source
          PROJECT_DIR="$(find source -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create local debug signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
