name: Build Android APK

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/fix-android-language.sh"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify extracted Android project is the build source
        shell: bash
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "Using canonical Android source: $GITHUB_WORKSPACE"

      - name: Verify Arabic-first fixed RTL language behavior
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/fix-android-language.sh" "$PROJECT_DIR"

      - name: Verify language implementation
        shell: bash
        run: |
          grep -q 'val layoutDirection = WebI18n.layoutDirection()' app/src/main/java/com/example/ui/navigation/MainAppScaffold.kt
          grep -q 'MutableStateFlow(WebI18n.read(application))' app/src/main/java/com/example/finance/ui/FinanceViewModel.kt
          grep -q 'WebI18n.write(getApplication(), lang)' app/src/main/java/com/example/finance/ui/FinanceViewModel.kt
          grep -q 'const val LOCALE_KEY = "bye-pro-finance.locale"' app/src/main/java/com/example/finance/i18n/WebI18n.kt
          grep -q 'preferences.getBoolean("dark_mode", true)' app/src/main/java/com/example/finance/ui/FinanceViewModel.kt
          echo "PASS: Arabic default, persisted locale, fixed RTL layout, and persistent theme."
          echo "PASS: Arabic default, persisted web-compatible locale key, fixed RTL layout."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create local debug signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: testDebugUnitTest --stacktrace

      - name: Stop Gradle daemons before emulator
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --stop || true

      - name: Run Android emulator UI tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: ${{ env.PROJECT_DIR }}
          script: gradle connectedDebugAndroidTest --stacktrace

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: assembleDebug --stacktrace

      - name: Prepare production signing key
        id: release_signing
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK skipped: configure KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD repository secrets."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore
          # Validate the store password and discover the actual private-key alias.
          KEY_ALIAS="$(LC_ALL=C keytool -list -v -keystore release.keystore -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{alias=$2} /Entry type: PrivateKeyEntry/{print alias; exit}')"
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "::error::The keystore has no readable PrivateKeyEntry. Check the uploaded keystore and STORE_PASSWORD."
            exit 1
          fi
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Production signing key detected and validated."

      - name: Build signed production Release APK
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        uses: gradle/gradle-build-action@v3
        env:
          KEYSTORE_PATH: ${{ env.PROJECT_DIR }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ steps.release_signing.outputs.key_alias }}
        with:
          gradle-version: "9.3.1"
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: assembleRelease --stacktrace

      - name: Upload signed Release APK
        if: ${{ steps.release_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-Release-10.0.4
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
