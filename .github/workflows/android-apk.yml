name: Build Android APK

on:
  push:
    paths:
      - "bye-pro-finance.zip"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/fix-android-language.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore verified Android source baseline
        shell: bash
        run: |
          git show c007ac8e55798e6c08621a175a297723ebc53a4d:bye-pro-finance.zip > bye-pro-finance.zip
          unzip -tq bye-pro-finance.zip

      - name: Extract Android project
        shell: bash
        run: |
          test -f bye-pro-finance.zip
          mkdir -p source
          unzip -q bye-pro-finance.zip -d source
          PROJECT_DIR="$(find source -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Apply Arabic-first fixed RTL language behavior
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/fix-android-language.sh" "$PROJECT_DIR"

      - name: Persist patched Android source archive
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/bye-pro-finance.updated.zip" .
          cd "$GITHUB_WORKSPACE"
          mv bye-pro-finance.updated.zip bye-pro-finance.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bye-pro-finance.zip
          if ! git diff --cached --quiet; then
            git commit -m "feat(android): Arabic-first RTL and complete brand themes [skip ci]"
            git push
          fi

      - name: Package extracted source for inspection
        shell: bash
        run: |
          cd "$(dirname "$PROJECT_DIR")"
          zip -qr "$GITHUB_WORKSPACE/android-source-inspection.zip" "$(basename "$PROJECT_DIR")"

      - name: Upload extracted Android source
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-Source
          path: android-source-inspection.zip
          if-no-files-found: error
          retention-days: 3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install build packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create local debug signing key
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          build-root-directory: ${{ env.PROJECT_DIR }}
          arguments: assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
