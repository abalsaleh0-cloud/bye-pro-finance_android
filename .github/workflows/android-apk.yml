name: Build Android Release APK

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/fix-android-language.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Gemini API key for the Android build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
            chmod 600 .env
            echo "Gemini key injected from the repository secret."
          else
            echo "::warning::GEMINI_API_KEY is not configured; AI chat and intent understanding will be unavailable in this APK."
          fi

      - name: Verify Android project and language behavior
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          bash .github/scripts/fix-android-language.sh "$GITHUB_WORKSPACE"
          grep -q 'val layoutDirection = WebI18n.layoutDirection()' app/src/main/java/com/example/ui/navigation/MainAppScaffold.kt
          grep -q 'const val LOCALE_KEY = "bye-pro-finance.locale"' app/src/main/java/com/example/finance/i18n/WebI18n.kt
          echo "Arabic-first fixed RTL implementation verified."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore production signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::One or more required Android signing secrets are missing."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/bye-pro-upload-key.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          KEY_ALIAS="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" 2>/dev/null | awk -F': ' '/^Alias name: / {print $2; exit}')"
          if [[ -z "$KEY_ALIAS" ]]; then
            echo "::error::Could not detect a signing alias in the supplied keystore."
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
          echo "Production keystore decoded; signing alias detected and validated."

      - name: Run unit tests
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          arguments: :app:testDebugUnitTest --stacktrace

      - name: Build signed production APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "9.3.1"
          arguments: :app:assembleRelease --stacktrace

      - name: Verify APK production signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "Signed release APK verification passed."

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: BYE-PRO-FINANCE-Android-Release-10.0.57
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
